<strive-header title="" />
<swiper-container
  #swiper
  zoom="true"
  pagination="true"
  pagination-clickable="true"
>
  @for (media of medias; track media) {
    <swiper-slide>
      <section class="container">
        <article class="swiper-zoom-container">
          @if (media.fileType === 'video') {
            @if (media.status === 'uploaded') {
              <strive-video-player [storagePath]="media | mediaRef"></strive-video-player>
            } @else {
              <p class="description">{{ media.status === 'error' ? 'This video could not be processed' : 'Processing video...' }}</p>
            }
          } @else {
            <img [ref]="media | mediaRef" [asset]="asset" [width]="2048" />
          }
        </article>
        @if (media.description) {
          <p [innerHTML]="media.description | toHTML" class="description"></p>
        }
      </section>
    </swiper-slide>
  }
</swiper-container>
