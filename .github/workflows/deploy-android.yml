name: Deploy Android

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - production
  workflow_call:
    inputs:
      track:
        description: 'Play Store track (internal or production)'
        required: false
        default: 'internal'
        type: string

concurrency:
  group: deploy-android
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/journal/android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps
        working-directory: .

      - name: Install Capacitor plugins
        run: npm install
        working-directory: apps/journal

      - name: Build journal web assets
        run: npx nx build journal --configuration=production --no-cloud
        working-directory: .

      - name: Sync Capacitor Android
        run: npx nx run journal:sync:android --no-cloud
        working-directory: .

      - name: Fix Capacitor plugin paths
        run: sed -i "s|'../node_modules|'../../../node_modules|g" capacitor.settings.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/journal/android

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Decode Play Store key
        run: echo "${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}" | base64 --decode > fastlane/play-store-key.json

      - name: Determine lane
        id: lane
        run: |
          TRACK="${{ inputs.track || 'internal' }}"
          if [ "$TRACK" = "production" ]; then
            echo "name=deploy_production" >> "$GITHUB_OUTPUT"
          else
            echo "name=deploy_internal" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Fastlane
        run: bundle exec fastlane ${{ steps.lane.outputs.name }}
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/apps/journal/android/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_STORE_JSON_KEY_FILE: fastlane/play-store-key.json

      # Keep the repo on the versionCode/versionName that was just uploaded.
      # [skip ci] so this commit does not start another deploy.
      - name: Commit version bump
        if: github.ref_type == 'branch'
        run: |
          CODE=$(grep -oP 'versionCode \K\d+' app/build.gradle)
          NAME=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          git commit -m "Android $NAME ($CODE) [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
